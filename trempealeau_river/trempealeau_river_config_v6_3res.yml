# Trempealeau River v6 3-reservoir architecture:
#   1. Loess + topsoil (+ minor blufftop Oneota)  — linear, b=1
#   2. Jordan Sandstone                            — Dupuit, b=2
#   3. Wonewoc Sandstone                           — Dupuit, b=2
#
# Junctions:
#   Loess → Jordan:    f_exfil_soil partition (vadose percolation lumped)
#   Jordan → Wonewoc:  leakance_R_jordan (head-driven; represents St. Lawrence
#                      + Lone Rock confining beds as a head-controlled aquitard)
#   Wonewoc → stream:  all (Eau Claire aquitard floor below)
#
# Initial values from v6 2-res widened result (backbone_runs/2026-06-25_121058).

timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/trempealeau_river/trempealeau_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 30.0      # loess + topsoil
    - 500.0     # Jordan
    - 2000.0    # Wonewoc (large storage, sustains baseflow)
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 1657.0
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 13        # soil (~13 d, from 2-res result)
    - 316       # Jordan placeholder (~300 d, typical shallow aquifer)
    - 31600     # Wonewoc placeholder (slow deep aquifer)
  exfiltration_fractions:
    - 0.45      # soil → stream vs recharge to Jordan
    - 1.0       # Jordan recession → stream (downward flux is via leakance_R)
    - 1.0       # Wonewoc → stream (Eau Claire aquitard floor)
  maximum_effective_depths__mm:
    - .inf
    - .inf
    - .inf
  recession_exponents:
    - 1.0       # loess linear
    - 2.0       # Jordan Dupuit
    - 2.0       # Wonewoc Dupuit

snowmelt:
  PDD_melt_factor: 2.64
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
