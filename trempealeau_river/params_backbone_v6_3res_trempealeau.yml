# Trempealeau River v6 3-RESERVOIR backbone (loess / Jordan / Wonewoc).
#
# Architecture (per Andy's geological model 2026-06-25):
#   - Loess + topsoil (+ blufftop Oneota)       b=1 linear,  fast
#   - Jordan Sandstone                          b=2 Dupuit,  shallow aquifer
#   - Wonewoc Sandstone                         b=2 Dupuit,  deep aquifer
#
# Junctions:
#   Loess → Jordan:    f_exfil_soil partition (active, calibrated)
#   Jordan → Wonewoc:  leakance_R_jordan (head-driven, active; represents
#                      St. Lawrence + Lone Rock confining beds)
#   Wonewoc → stream:  f_exfil_wonewoc = 1.0 fixed (Eau Claire floor)
#
# This is option B: leakance at the aquitard junction. f_exfil_jordan is fixed
# at 1.0 (all of Jordan's recession drainage exits to stream; the downward flux
# to Wonewoc is exclusively via the head-driven leakance term — physically
# correct for confined-aquifer junctions).
#
# Active param count: 7 (1 snow + 1 ET + 3 timescales + 1 partition + 1 leakance).
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       trempealeau_river_config_v6_3res.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          3
  reservoir_order:       [soil, jordan, wonewoc]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1911-01-01', end: '1920-12-31'}
    - {start: '1921-01-01', end: '1930-12-31'}
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 2.64
    fixed: 2.64
    active: true
  et_scale:
    description: Thornthwaite ET multiplier — FREE, single basin-wide value
    lower: 0.3
    upper: 3.0
    initial: 1.083
    fixed: 1.083
    active: true
  log__recession_coeff_soil:
    description: log10 τ_soil [days] — loess + topsoil
    lower: 0.5
    upper: 3.5
    initial: 1.1
    fixed: 1.1
    active: true
  log__recession_coeff_jordan:
    description: log10 τ_jordan [days] — Jordan sandstone aquifer
    lower: 1.0
    upper: 5.0
    initial: 2.5
    fixed: 2.5
    active: true
  log__recession_coeff_wonewoc:
    description: log10 τ_wonewoc [days] — Wonewoc sandstone deep aquifer
    lower: 1.0
    upper: 7.0
    initial: 4.5
    fixed: 4.5
    active: true
  f_exfiltration_soil:
    description: fraction of soil drainage to stream (rest = recharge to Jordan)
    lower: 0.01
    upper: 0.99
    initial: 0.45
    fixed: 0.45
    active: true
  log__leakance_R_jordan:
    description: log10 leakance R [days] for St. Lawrence + Lone Rock confining beds
    lower: 0.5
    upper: 5.0
    initial: 2.0
    fixed: 2.0
    active: true
  recession_b_soil:
    description: b_soil — linear loess
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  recession_b_jordan:
    description: b_jordan — Dupuit unconfined sandstone (fixed)
    lower: 1.0
    upper: 4.5
    initial: 2.0
    fixed: 2.0
    active: false
  recession_b_wonewoc:
    description: b_wonewoc — Dupuit unconfined sandstone (fixed)
    lower: 1.0
    upper: 4.5
    initial: 2.0
    fixed: 2.0
    active: false
  f_exfiltration_jordan:
    description: Jordan recession all to stream — leakance is the downward path
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  f_exfiltration_wonewoc:
    description: Wonewoc to stream — Eau Claire aquitard floor below
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  log__fdd_threshold:
    description: FGI — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: direct runoff fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
