# Trempealeau River v6 backbone — 2-RESERVOIR (soil + sandstone).
#
# Architecture (per Andy's geological model 2026-06-25):
#   - Truly unglaciated (Driftless Area, no till). Loess + topsoil sit directly
#     on bedrock — no semi-confining buffer.
#   - Watershed dominated by sandstone (Wonewoc + Mt Simon) with minor blufftop
#     carbonate. Treated as a single "near-ideal Darcy" lower reservoir:
#       b_sandstone = 2.0 fixed (Dupuit-Forchheimer unconfined porous medium,
#       Boussinesq late-time recession).
#   - Eau Claire Formation as aquitard floor → f_exfil_sandstone = 1.0.
#
# Contrast with Root v6_2res: Root has b_karst FREE (composite karst+sandstone
# behavior). Trempealeau has b fixed at the unconfined-porous-aquifer prior
# because there is no significant karst dissolution conduit network.
#
# Active param count: 5 (1 snow + 3 geologic + 1 ET).
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       trempealeau_river_config_v6_2res.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          2
  reservoir_order:       [soil, sandstone]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1911-01-01', end: '1920-12-31'}
    - {start: '1921-01-01', end: '1930-12-31'}
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 6.0
    fixed: 6.0
    active: true
  log__recession_coeff_soil:
    description: log10 τ_soil [days] — loess + topsoil (thin, fast — no till buffer)
    lower: 0.5
    upper: 3.5
    initial: 1.3
    fixed: 1.3
    active: true
  log__recession_coeff_sandstone:
    description: log10 τ_sandstone [days] — Wonewoc sandstone + shale interbeds (widened 2026-06-25)
    lower: 1.0
    upper: 7.0
    initial: 2.5
    fixed: 2.5
    active: true
  f_exfiltration_soil:
    description: fraction of soil discharge to stream (rest → recharge to sandstone)
    lower: 0.01
    upper: 0.99
    initial: 0.5
    fixed: 0.5
    active: true
  et_scale:
    description: Thornthwaite ET scaling — FREE, constant across decades
    lower: 0.3
    upper: 3.0
    initial: 0.755
    fixed: 0.755
    active: true
  recession_b_soil:
    description: b_soil — linear loess
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  recession_b_sandstone:
    description: b_sandstone — Dupuit-Forchheimer unconfined porous (fixed at 2.0)
    lower: 1.0
    upper: 4.5
    initial: 2.0
    fixed: 2.0
    active: false
  log__fdd_threshold:
    description: FGI — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
