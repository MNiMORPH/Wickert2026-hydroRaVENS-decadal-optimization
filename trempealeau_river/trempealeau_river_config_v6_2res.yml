timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/trempealeau_river/trempealeau_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 30.0      # loess + topsoil (thin, drains fast)
    - 1500.0    # Wonewoc + minor blufftop carbonate
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 1657.0
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 30        # soil (placeholder — calibrated and overridden by driver)
    - 300       # sandstone (placeholder — calibrated and overridden)
  exfiltration_fractions:
    - 0.5       # soil → stream vs recharge to sandstone (overridden by driver)
    - 1.0       # sandstone → all to stream (Eau Claire aquitard = no-flow floor)
  maximum_effective_depths__mm:
    - .inf
    - .inf
  recession_exponents:
    - 1.0       # b_soil — linear loess
    - 2.0       # b_sandstone — Dupuit-Forchheimer unconfined porous

snowmelt:
  PDD_melt_factor: 6.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
