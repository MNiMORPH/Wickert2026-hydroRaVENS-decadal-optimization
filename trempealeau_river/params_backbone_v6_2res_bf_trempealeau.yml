# Trempealeau River v6 2-RESERVOIR + constant baseflow_Q.
#
# Per Andy 2026-06-25: "Trempealeau wants a fast upper pathway and some constant
# baseflow below." The 3-res test collapsed: τ_jordan and leakance_R_jordan
# pegged at upper bounds, the Wonewoc reservoir shut off. Data can't support
# a dynamic deep reservoir.
#
# Architecture:
#   - Loess + topsoil + minor blufftop Oneota  (b=1 linear, fast upper pathway)
#   - Jordan + Wonewoc sandstone lumped         (b=2 Dupuit, intermediate aquifer)
#   - Deep Cambrian (Mt. Simon etc) → constant baseflow_Q ADDITIVE FLUX
#
# This represents the unmodelable-by-streamflow deep regional aquifer
# (residence time >> calibration window) as a constant input rather than
# trying to calibrate a dynamic reservoir for it.
#
# Active param count: 6 (1 snow + 1 ET + 2 timescales + 1 partition + 1 baseflow).
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       trempealeau_river_config_v6_2res.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          2
  reservoir_order:       [soil, sandstone]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1911-01-01', end: '1920-12-31'}
    - {start: '1921-01-01', end: '1930-12-31'}
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 2.64
    fixed: 2.64
    active: true
  et_scale:
    description: Thornthwaite ET multiplier — FREE, single basin-wide value
    lower: 0.3
    upper: 3.0
    initial: 1.083
    fixed: 1.083
    active: true
  log__recession_coeff_soil:
    description: log10 τ_soil [days] — loess + topsoil
    lower: 0.5
    upper: 3.5
    initial: 1.1
    fixed: 1.1
    active: true
  log__recession_coeff_sandstone:
    description: log10 τ_sandstone [days] — Jordan + Wonewoc lumped (intermediate aquifer)
    lower: 1.0
    upper: 7.0
    initial: 2.5
    fixed: 2.5
    active: true
  f_exfiltration_soil:
    description: fraction of soil drainage to stream (rest → sandstone)
    lower: 0.01
    upper: 0.99
    initial: 0.45
    fixed: 0.45
    active: true
  baseflow_Q:
    description: constant regional groundwater import [mm/day] — deep Cambrian aquifer
    lower: 0.0
    upper: 1.0
    initial: 0.1
    fixed: 0.1
    active: true
  recession_b_soil:
    description: b_soil — linear loess
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  recession_b_sandstone:
    description: b_sandstone — Dupuit-Forchheimer unconfined porous (fixed at 2)
    lower: 1.0
    upper: 4.5
    initial: 2.0
    fixed: 2.0
    active: false
  log__fdd_threshold:
    description: FGI — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: direct runoff fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
