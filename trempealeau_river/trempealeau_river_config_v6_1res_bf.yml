# Trempealeau River v6 1-RESERVOIR + constant baseflow_Q.
# Single lumped reservoir for loess+sandstone (b=2 Dupuit); deep Cambrian via baseflow_Q.

timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/trempealeau_river/trempealeau_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 500.0     # composite loess+sandstone
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 1657.0
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 100       # placeholder (calibrated and overridden)
  exfiltration_fractions:
    - 1.0       # all to stream
  maximum_effective_depths__mm:
    - .inf
  recession_exponents:
    - 2.0       # b = 2 Dupuit (sandstone-dominated)

snowmelt:
  PDD_melt_factor: 2.64
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
