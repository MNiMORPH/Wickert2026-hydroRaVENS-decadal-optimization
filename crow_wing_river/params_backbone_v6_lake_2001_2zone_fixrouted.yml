# Crow Wing v6 LAKE — TWO-LAND-ZONE, τ_routed FIXED / τ_lake FREE+EXPANDED (2001-2010).
#
# Follows the identifiability finding: τ_routed (lake-feeding land) is invisible
# to the gauge (KGE flat 10 d–10,000 d) because the lake buffers it entirely —
# it sits on a ridge with τ_lake. So we COLLAPSE the ridge: fix τ_routed and let
# only τ_lake (the physically-interpretable lake buffer) calibrate.
#
#   - τ_routed FIXED at 10 d (log 1.0), inactive. The lake-fed sandy-outwash
#     district delivers quickly; the LAKE is the sole buffer. The gauge cannot
#     constrain this value (modeling choice, to be replaced by a terrain prior).
#   - τ_lake (recession_coeff_lake) FREE, upper bound raised 6.0 -> 7.0 so the
#     now-forced buffering is not artificially capped. τ_lake≈25,400 (log 4.40)
#     was shown physically defensible (≈40 m outlet, ~1-1.5 yr residence;
#     see MNiShed/DESIGN_lakes.md storage↔stage section).
#
# Initials SEEDED from the previous free-split best (eval 1574). Harmless warm
# start: EGO explores the whole box via LHS+EI, PS refines from EGO's best.
# ego_initial_samples 300 -> 400 for the (one fewer dim, one wider) box.
#
# 6 active params: PDD, et_scale, τ_direct, τ_lake, H_sill, f_split.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      400
  ego_seed:                 42
  ps_max_evaluations:       2500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6_lake_2zone.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 1.156
    fixed: 1.156
    active: true
  et_scale:
    description: Thornthwaite ET multiplier
    lower: 0.3
    upper: 2.0
    initial: 0.592
    fixed: 0.592
    active: true
  log__recession_coeff_direct:
    description: log10 matrix τ [days] — direct_land zone (drains to gauge)
    lower: 0.0
    upper: 4.0
    initial: 1.5066
    fixed: 1.5066
    active: true
  log__recession_coeff_routed:
    description: log10 matrix τ [days] — lake_basin_land zone; FIXED (gauge-blind, lake buffers it); 10 d = fast sandy-outwash delivery
    lower: 0.0
    upper: 4.0
    initial: 1.0
    fixed: 1.0
    active: false
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^(5/3); ceiling raised to 7.0 (τ_routed fixed forces buffering onto lake)
    lower: 0.3
    upper: 7.0
    initial: 4.4049
    fixed: 4.4049
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 0.0
    upper: 4.0
    initial: 1.3306
    fixed: 1.3306
    active: true
  f_split:
    description: fraction of NON-LAKE land area assigned to direct_land (vs lake_basin_land); lake fixed at NHD 0.30
    lower: 0.05
    upper: 0.95
    initial: 0.3958
    fixed: 0.3958
    active: true
