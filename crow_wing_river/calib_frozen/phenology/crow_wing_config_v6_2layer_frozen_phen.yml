# Crow Wing v6 — TWO-LAYER LAND (soil + gw) + FROZEN GROUND (FGI), feeding lake.
#
# Replaces the PDM saturation-excess experiment. PDM fired on summer rain too
# (wetness-gated) and was rejected by calibration. Frozen ground is the
# SEASONALLY-GATED fast pathway the freshet actually needs: when FGI exceeds
# fdd_threshold the soil's top reservoir is forced f_to_discharge=1.0 (all
# snowmelt -> direct runoff = freshet); it restores normal infiltration on thaw.
# For a sandy outwash basin this is THE dominant overland-flow control (sand
# only sheds water when frozen). PDM disabled (pdm_H0__mm null).
#
# (frozen_ground was OFF in every prior run — the missing piece all along.)

timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/crow_wing_river/crow_wing_forcing.csv

catchment:
  drainage_basin_area__km2: 2334.8
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

sub_catchments:
  - name: direct_land
    area_fraction: 0.30
    reservoirs:
      recession_coefficients:       [20.0, 3000.0]
      exfiltration_fractions:       [0.5, 1.0]
      maximum_effective_depths__mm: [1000000000.0, 1000000000.0]
      pdm_H0__mm:                   [null, null]
      multipath_thresholds__mm:     [10000000000.0, 10000000000.0]
      multipath_timescales__days:   [1.0, 1.0]
      recession_exponents:          [1.0, 1.0]
    initial_conditions:
      water_reservoir_effective_depths__mm: [50.0, 500.0]

  - name: lake_basin_land
    area_fraction: 0.40
    reservoirs:
      recession_coefficients:       [20.0, 3000.0]
      exfiltration_fractions:       [0.5, 1.0]
      maximum_effective_depths__mm: [1000000000.0, 1000000000.0]
      pdm_H0__mm:                   [null, null]
      multipath_thresholds__mm:     [10000000000.0, 10000000000.0]
      multipath_timescales__days:   [1.0, 1.0]
      recession_exponents:          [1.0, 1.0]
    initial_conditions:
      water_reservoir_effective_depths__mm: [50.0, 500.0]

  - name: lake
    kind: lake
    area_fraction: 0.30
    lake:
      outflow_coefficient: 0.005
      sill_storage__mm:    250.0
      outflow_exponent:    1.6667
      gw_partner:          lake_basin_land
      f_route_lake:        1.0
    initial_conditions:
      lake_storage__mm:    600.0

snowmelt:
  PDD_melt_factor: 4.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false

phenology:
  enabled: true
  base_temperature__C:  5.0    # GDD base (~deciduous)
  leafout_GDD:          100.0  # cumulative GDD (reset Jan 1) at green-up onset
  full_canopy_GDD:      400.0  # cumulative GDD at full canopy
  dormant_Kc:           0.5    # ET coefficient outside growing season
  full_Kc:              1.0    # ET coefficient at full canopy
  senescence_start_doy: 260    # fall ramp-down begins (~mid-Sep)
  senescence_end_doy:   305    # fully dormant (~early Nov)
