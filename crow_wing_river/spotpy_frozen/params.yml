# Crow Wing v6 — TWO-LAYER LAND + FROZEN GROUND, in-process SPOTPY SCE-UA.
# 9 active params: PDD, et_scale, log τ_soil, log τ_gw, f_exfil_soil,
# log τ_lake, log H_sill_lake, f_route_lake, log fdd_threshold (FGI).
# PDM dropped; snow_insulation_k fixed 0 (max frozen-ground effect) for this
# first test; fgi_decay_coeff fixed 0.97 (config). Land physics shared.
modules:
  snowpack:          true
  frozen_ground:     true
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
driver:
  config_template:       crow_wing_config_v6_2layer_frozen.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 4.0
    fixed: 4.0
    active: true
  et_scale:
    description: Thornthwaite ET multiplier
    lower: 0.3
    upper: 2.0
    initial: 0.80
    fixed: 0.80
    active: true
  log__recession_coeff_soil:
    description: log10 soil τ [days] — shallow responsive layer (both land zones)
    lower: 0.0
    upper: 3.0
    initial: 1.30
    fixed: 1.30
    active: true
  log__recession_coeff_gw:
    description: log10 groundwater τ [days] — deep baseflow layer (both land zones)
    lower: 1.0
    upper: 5.0
    initial: 3.50
    fixed: 3.50
    active: true
  f_exfil_soil:
    description: fraction of soil drainage to stream (rest recharges gw); both zones
    lower: 0.0
    upper: 1.0
    initial: 0.50
    fixed: 0.50
    active: true
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^(5/3)
    lower: 0.3
    upper: 7.0
    initial: 2.50
    fixed: 2.50
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 0.0
    upper: 4.0
    initial: 2.00
    fixed: 2.00
    active: true
  f_route_lake:
    description: fraction of lake-district discharge routed THROUGH the lake (free)
    lower: 0.0
    upper: 1.0
    initial: 1.0
    fixed: 1.0
    active: true
  log__fdd_threshold:
    description: log10 FGI threshold [degC*day]; ground frozen (all snowmelt->runoff) when FGI exceeds it
    lower: 0.0
    upper: 3.0
    initial: 1.50
    fixed: 1.50
    active: true
