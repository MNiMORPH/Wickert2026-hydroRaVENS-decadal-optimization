# Crow Wing River v6 backbone, 1931-2020.
#
# Same v6 architecture as BLR/LSR/Cottonwood (1-reservoir multipath, 4 active
# static params, FGI off, et_scale fixed at 0.755). Test basin for whether
# lake-rich till basins (Crow Wing has substantial lake area in upper basin)
# need explicit lake support in MNiShed.
#
# Diagnostic signatures to look for if lakes matter (per feedback_lake_support_needs):
#   - PDD lower or et_scale demand higher than till basins (lake ET >> Thornthwaite)
#   - Matrix τ forced to longer values to mimic lake outflow recession
#   - Multipath H_thr / τ_mp at unusual values
#   - KGE notably below till baseline (BLR 0.78, LSR 0.79, Cottonwood 0.62)
#
# Decades: 1931-1940, 1941-1950, ..., 1971-1980, 1991-2000, 2001-2010, 2011-2020
# Skipped: 1910s (sparse), 1920s (gap), 1980s (gauge outage)
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          1
  reservoir_order:       [till]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 6.0
    fixed: 6.0
    active: true
  log__recession_coeff_till:
    description: log10 matrix recession timescale τ [days]
    lower: 0.5
    upper: 4.0
    initial: 2.7
    fixed: 2.7
    active: true
  log__multipath_threshold_till:
    description: log10 multipath activation depth H_thr [mm]
    lower: 0.5
    upper: 3.0
    initial: 2.1
    fixed: 2.1
    active: true
  log__multipath_timescale_till:
    description: log10 multipath drain timescale τ_mp [days]
    lower: 0.0
    upper: 2.0
    initial: 1.3
    fixed: 1.3
    active: true
  log__fdd_threshold:
    description: log10 FGI threshold — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  recession_b_till:
    description: b — linear matrix
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  et_scale:
    description: Thornthwaite ET scaling — fixed at BLR D3 mean
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
