# Crow Wing v6 LAKE — single-decade test (2001-2010).
# 7 active params: 1 snow + 1 ET + 3 land + 2 lake.
# All other v6 settings as in etscale baseline.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6_lake.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 7.83
    fixed: 7.83
    active: true
  et_scale:
    description: Thornthwaite ET multiplier (basin-level, includes lake via collinearity)
    lower: 0.3
    upper: 1.5
    initial: 0.56
    fixed: 0.56
    active: true
  log__recession_coeff_till:
    description: log10 matrix τ [days] — LAND sub-catchment
    lower: 1.0
    upper: 3.5
    initial: 2.98
    fixed: 2.98
    active: true
  log__multipath_threshold_till:
    description: log10 multipath H_thr [mm] — LAND
    lower: 1.0
    upper: 3.5
    initial: 2.58
    fixed: 2.58
    active: true
  log__multipath_timescale_till:
    description: log10 multipath τ_mp [days] — LAND
    lower: 0.5
    upper: 2.5
    initial: 1.99
    fixed: 1.99
    active: true
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^b [days]; a ∈ [0.005, 0.5]
    lower: 0.3
    upper: 2.3
    initial: 1.30
    fixed: 1.30
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 1.0
    upper: 3.0
    initial: 2.30
    fixed: 2.30
    active: true
