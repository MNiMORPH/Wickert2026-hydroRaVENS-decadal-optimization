# Crow Wing v6 — TWO-LAYER LAND (soil+gw) + PDM saturation-excess, feeding lake.
# Single-decade (2001-2010) test: does a wetness-activated fast spring pathway
# (PDM saturation-excess on the soil) produce the freshet within the existing
# architecture (config-only, no MNiShed source edit)?
#
# 9 active params. Land physics SHARED between direct_land and lake_basin_land
# (driver applies the same soil/gw/exfil/pdm to both). f_route_lake is FREE and
# is the structural diagnostic: low => freshet only reaches gauge by bypassing
# the lake (cascade-topology really missing); high+freshet => lake transmits.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      450
  ego_seed:                 42
  ps_max_evaluations:       3000
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6_2layer.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 4.0
    fixed: 4.0
    active: true
  et_scale:
    description: Thornthwaite ET multiplier
    lower: 0.3
    upper: 2.0
    initial: 0.80
    fixed: 0.80
    active: true
  log__recession_coeff_soil:
    description: log10 soil τ [days] — shallow responsive layer (both land zones)
    lower: 0.0
    upper: 3.0
    initial: 1.30
    fixed: 1.30
    active: true
  log__recession_coeff_gw:
    description: log10 groundwater τ [days] — deep slow baseflow layer (both land zones)
    lower: 1.0
    upper: 5.0
    initial: 3.50
    fixed: 3.50
    active: true
  f_exfil_soil:
    description: fraction of soil drainage to stream (rest recharges gw); both land zones
    lower: 0.0
    upper: 1.0
    initial: 0.50
    fixed: 0.50
    active: true
  log__pdm_H0:
    description: log10 PDM characteristic storage depth [mm] on the soil layer (saturation-excess)
    lower: 1.0
    upper: 3.0
    initial: 2.00
    fixed: 2.00
    active: true
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^(5/3)
    lower: 0.3
    upper: 7.0
    initial: 2.50
    fixed: 2.50
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 0.0
    upper: 4.0
    initial: 2.00
    fixed: 2.00
    active: true
  f_route_lake:
    description: fraction of lake-district discharge routed THROUGH the lake (free; structural diagnostic)
    lower: 0.0
    upper: 1.0
    initial: 1.0
    fixed: 1.0
    active: true
