# Crow Wing v6 — TWO-LAYER LAND (soil + groundwater) with PDM saturation-excess,
# feeding the lake. Tests whether a wetness-activated fast spring pathway
# (saturation-excess overland flow on the shallow soil) produces the freshet
# WITHIN the existing architecture (no MNiShed source edit).
#
# Each land zone is now a 2-reservoir cascade:
#   - soil  (top): shallow, responsive. PDM saturation-excess (pdm_H0__mm) sheds
#     the saturated fraction f_sat=1-exp(-H/pdm_H0) of recharge as fast overland
#     flow -> stream/qi (the freshet). Remainder infiltrates. exfiltration splits
#     soil drainage between stream and the gw layer below.
#   - gw  (bottom): deep, slow. Sustains summer baseflow. exfiltration = 1.0
#     (all to stream). The lake's gw_partner exchange uses THIS (deepest) layer.
#
# Land physics shared between direct_land and lake_basin_land (driver sets the
# same soil/gw/pdm values on both). They differ only in routing: lake_basin_land
# -> lake (f_route_lake), direct_land -> gauge. Lake outlet b=5/3, Hmax off.

timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/crow_wing_river/crow_wing_forcing.csv

catchment:
  drainage_basin_area__km2: 2334.8
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

sub_catchments:
  - name: direct_land
    area_fraction: 0.30
    reservoirs:
      recession_coefficients:       [20.0, 3000.0]        # soil, gw (driver-overridden)
      exfiltration_fractions:       [0.5, 1.0]            # soil split (overridden), gw->stream
      maximum_effective_depths__mm: [1000000000.0, 1000000000.0]        # Hmax off (PDM active on soil)
      pdm_H0__mm:                   [150.0, null]         # PDM on soil only (overridden)
      multipath_thresholds__mm:     [10000000000.0, 10000000000.0]      # multipath disabled
      multipath_timescales__days:   [1.0, 1.0]
      recession_exponents:          [1.0, 1.0]
    initial_conditions:
      water_reservoir_effective_depths__mm: [50.0, 500.0]

  - name: lake_basin_land
    area_fraction: 0.40
    reservoirs:
      recession_coefficients:       [20.0, 3000.0]
      exfiltration_fractions:       [0.5, 1.0]
      maximum_effective_depths__mm: [1000000000.0, 1000000000.0]
      pdm_H0__mm:                   [150.0, null]
      multipath_thresholds__mm:     [10000000000.0, 10000000000.0]
      multipath_timescales__days:   [1.0, 1.0]
      recession_exponents:          [1.0, 1.0]
    initial_conditions:
      water_reservoir_effective_depths__mm: [50.0, 500.0]

  - name: lake
    kind: lake
    area_fraction: 0.30
    lake:
      outflow_coefficient: 0.005
      sill_storage__mm:    250.0
      outflow_exponent:    1.6667
      gw_partner:          lake_basin_land     # exchanges with its deepest (gw) reservoir
      f_route_lake:        1.0                  # driver-patched (free parameter)
    initial_conditions:
      lake_storage__mm:    600.0

snowmelt:
  PDD_melt_factor: 4.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
