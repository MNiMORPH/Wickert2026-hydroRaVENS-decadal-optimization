# Crow Wing v6 LAKE — f_route_lake AND f_direct_runoff BOTH FREE (2001-2010).
# 7 active params: PDD, et_scale, log τ_matrix, log recession_coeff_lake,
# log H_sill_lake, f_route_lake, f_direct_runoff.
#
# Test: does adding a fast pathway (direct_runoff = saturated surface storm runoff,
# bypasses the cascade) capture the storm peaks v3 missed (under by ~50% on top-20)?
# Direct-runoff module ENABLED.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     true                    # NEW vs v3
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      300
  ego_seed:                 42
  ps_max_evaluations:       2500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6_lake_no_mp.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 7.83
    fixed: 7.83
    active: true
  et_scale:
    description: Thornthwaite ET multiplier
    lower: 0.3
    upper: 2.0
    initial: 0.55
    fixed: 0.55
    active: true
  log__recession_coeff_till:
    description: log10 matrix τ [days] — LAND sub-catchment
    lower: 0.0
    upper: 4.0
    initial: 2.11
    fixed: 2.11
    active: true
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^(5/3); a ∈ [10⁻⁶, 0.5]
    lower: 0.3
    upper: 6.0
    initial: 3.11
    fixed: 3.11
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 0.0
    upper: 4.0
    initial: 2.74
    fixed: 2.74
    active: true
  f_route_lake:
    description: fraction of land discharge routed THROUGH the lake (calibrated)
    lower: 0.0
    upper: 1.0
    initial: 0.243
    fixed: 0.243
    active: true
  f_direct_runoff:
    description: fraction of daily recharge bypassing the cascade to Q (saturated surface storm runoff)
    lower: 0.0
    upper: 0.5
    initial: 0.05
    fixed: 0.05
    active: true
