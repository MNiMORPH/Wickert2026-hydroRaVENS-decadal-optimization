# Crow Wing v6 LAKE — TWO-LAND-ZONE with AREA SPLIT CALIBRATED (2001-2010).
#
# 7 active params: PDD, et_scale, log τ_direct, log τ_routed,
# log recession_coeff_lake, log H_sill_lake, f_split.
#
# Extends params_backbone_v6_lake_2001_2zone.yml by freeing the land/land area
# allocation. f_split = fraction of the NON-LAKE land area (0.70) assigned to
# direct_land; lake_basin_land gets the rest; lake stays fixed at its NHD value
# (0.30). f_split init = 0.4286 reproduces the fixed-area split (direct 0.30 /
# routed 0.40), so the search starts from the known-good point.
#
# Driver patches area_fraction per-eval (driver_backbone_v6_lake_2zone_fsplit.py).
# Multipath disabled, f_route_lake=1.0 fixed in config.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      300
  ego_seed:                 42
  ps_max_evaluations:       2500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       crow_wing_config_v6_lake_2zone.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '2001-01-01', end: '2010-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 9.32
    fixed: 9.32
    active: true
  et_scale:
    description: Thornthwaite ET multiplier
    lower: 0.3
    upper: 2.0
    initial: 0.55
    fixed: 0.55
    active: true
  log__recession_coeff_direct:
    description: log10 matrix τ [days] — direct_land zone (drains to gauge)
    lower: 0.0
    upper: 4.0
    initial: 1.30
    fixed: 1.30
    active: true
  log__recession_coeff_routed:
    description: log10 matrix τ [days] — lake_basin_land zone (drains through lake)
    lower: 0.0
    upper: 4.0
    initial: 2.50
    fixed: 2.50
    active: true
  log__recession_coeff_lake:
    description: log10 (1/a) for lake outflow Q=a(H-H_sill)^(5/3); a ∈ [10⁻⁶, 0.5]
    lower: 0.3
    upper: 6.0
    initial: 2.85
    fixed: 2.85
    active: true
  log__H_sill_lake:
    description: log10 lake sill threshold [mm conceptual storage]
    lower: 0.0
    upper: 4.0
    initial: 2.44
    fixed: 2.44
    active: true
  f_split:
    description: fraction of NON-LAKE land area assigned to direct_land (vs lake_basin_land); lake fixed at NHD 0.30
    lower: 0.05
    upper: 0.95
    initial: 0.4286
    fixed: 0.4286
    active: true
