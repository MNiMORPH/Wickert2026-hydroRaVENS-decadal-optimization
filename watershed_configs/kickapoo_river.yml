# Discharge record: peaks from 1939
# Driftless Area, SW WI — highly sinuous karst/forested watershed; natural reference
# Note: karst conduit flow may challenge the standard 3-reservoir structure

name:  kickapoo_river
gauge: "05408000"
title: "Kickapoo River"
grass_location: KickapooRiver
