name:  crow_river_mn
gauge: "05280000"
title: "Crow River (MN)"
grass_location: CrowRiverMN
grass_epsg: 32615

forcing:
  start:       '1905-01-01'
  end:         '2024-12-31'
  csv_name:    crow_river_mn_forcing.csv
  config_name: crow_river_mn_config_1905_2024.yml

decades:
  first_year: 1911
  last_year:  2021

initial_params:
  log__t_recession_soil:         4.493
  log__t_recession_intermediate: 1.021
  log__t_recession_deep:         3.771
  f_exfiltration_soil:           0.6662
  f_exfiltration_intermediate:   0.0120
  PDD_melt_factor:               7.8611
  recession_b_soil:              5.4907
  log__fdd_threshold:            2.502
