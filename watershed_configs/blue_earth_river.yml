# Blue Earth River near Rapidan, MN (USGS 05320000)
# Drainage area: ~2,410 sq mi / ~6,242 km² (refined by v.in.waterdata)
# Discharge record: 1909-08-01 to present (gaps 1910-1939, 1945-1949)
# Forcing start: 1905 gives ~6 yr spin-up before first scored decade (1911-1920)

name:  blue_earth_river
gauge: "05320000"
title: "Blue Earth River"
grass_location: BlueEarthRiver

forcing:
  start:       '1905-01-01'
  end:         '2024-12-31'
  csv_name:    blue_earth_forcing.csv
  config_name: blue_earth_config_1905_2024.yml

decades:
  first_year: 1911
  last_year:  2021

# Warm-start from Cannon River A02 best-fit; will be refined per-decade
initial_params:
  log__t_recession_soil:         4.493
  log__t_recession_intermediate: 1.021
  log__t_recession_deep:         3.771
  f_exfiltration_soil:           0.6662
  f_exfiltration_intermediate:   0.0120
  PDD_melt_factor:               7.8611
  recession_b_soil:              5.4907
  log__fdd_threshold:            2.502
