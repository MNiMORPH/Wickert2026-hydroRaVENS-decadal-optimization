# Le Sueur River near Rapidan, MN (USGS 05320500)
# Drainage area: ~1,110 sq mi / ~2,875 km² (refined by v.in.waterdata)
# Discharge record: 1939-10-01 to present (broadly continuous)
# Forcing start: 1935 gives ~6 yr spin-up before first scored decade (1941-1950)
# Note: most-studied Minnesota River tributary for tile-drainage signal

name:  le_sueur_river
gauge: "05320500"
title: "Le Sueur River"
grass_location: LeSueurRiver

forcing:
  start:       '1935-01-01'
  end:         '2024-12-31'
  csv_name:    le_sueur_forcing.csv
  config_name: le_sueur_config_1935_2024.yml

decades:
  first_year: 1941
  last_year:  2021

# Warm-start from Cannon River A02 best-fit; will be refined per-decade
initial_params:
  log__t_recession_soil:         4.493
  log__t_recession_intermediate: 1.021
  log__t_recession_deep:         3.771
  f_exfiltration_soil:           0.6662
  f_exfiltration_intermediate:   0.0120
  PDD_melt_factor:               7.8611
  recession_b_soil:              5.4907
  log__fdd_threshold:            2.502
