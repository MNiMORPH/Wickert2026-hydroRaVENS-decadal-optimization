timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/root_river/root_river_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 50.0      # loess + topsoil
    - 1000.0    # karst + Wonewoc sandstone (combined)
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 3238.2
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 30        # soil (placeholder — calibrated and overridden by driver)
    - 300       # karst+sandstone (placeholder — calibrated and overridden)
  exfiltration_fractions:
    - 0.5       # soil → stream vs recharge to karst (overridden by driver)
    - 1.0       # karst → all to stream (Eau Claire aquitard = no-flow floor)
  maximum_effective_depths__mm:
    - .inf
    - .inf

snowmelt:
  PDD_melt_factor: 6.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
