timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/root_river/root_river_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 50.0      # soil / loess (thin, drains fast)
    - 500.0     # epikarst / Galena-Decorah
    - 2000.0    # St. Peter / deep sandstone
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 3238.2
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 30       # soil (placeholder — calibrate)
    - 300      # intermediate (placeholder — calibrate)
    - 10000    # deep (placeholder — calibrate)
  exfiltration_fractions:
    - 0.5      # soil: split between stream and recharge to intermediate
    - 0.1      # intermediate: small fraction direct to stream; bulk via leakance to deep
    - 0.5      # deep: split between stream (springs) and karst loss
  maximum_effective_depths__mm:
    - .inf
    - .inf
    - .inf

snowmelt:
  PDD_melt_factor: 6.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
