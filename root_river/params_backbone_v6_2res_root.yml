# Root River v6 backbone — 2-RESERVOIR (soil + karst+sandstone).
#
# Architecture (per Andy's geological model 2026-06-25):
#   - Loess + topsoil on top (upper reservoir, linear b=1)
#   - Karst (Galena-Decorah carbonate) + Wonewoc sandstone below, treated as ONE
#     nonlinear reservoir because Wonewoc is hydraulically connected below the
#     karst. b_karst FREE (composite of b_karst + b_sandstone behaviors).
#   - Eau Claire Formation in valley bottoms = aquitard floor → no deep
#     reservoir needed; karst exfiltrates fully to stream (f_karst = 1.0).
#
# This setup is the natural simplification implied by v6_3res's degenerate
# result (τ_inter, τ_deep, f_exfil_deep all pegged at bounds — the optimizer
# couldn't use a deep reservoir because the geology has none for it to occupy).
#
# Active param count: 6 (1 snow + 4 geologic + 1 ET).
# H_threshold_karst: OFF (b_karst free already provides nonlinearity).
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       root_river_config_v6_2res.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          2
  reservoir_order:       [soil, karst]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1911-01-01', end: '1920-12-31'}
    - {start: '1921-01-01', end: '1930-12-31'}
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 15.0
    initial: 6.0
    fixed: 6.0
    active: true
  log__recession_coeff_soil:
    description: log10 τ_soil [days] — loess + topsoil drainage
    lower: 0.5
    upper: 3.5
    initial: 1.5
    fixed: 1.5
    active: true
  log__recession_coeff_karst:
    description: log10 τ_karst [days] — combined karst + Wonewoc sandstone
    lower: 1.0
    upper: 5.0
    initial: 2.5
    fixed: 2.5
    active: true
  f_exfiltration_soil:
    description: fraction of soil discharge to stream (rest → recharge to karst)
    lower: 0.01
    upper: 0.99
    initial: 0.5
    fixed: 0.5
    active: true
  recession_b_karst:
    description: b_karst — FREE; composite of b_karst + b_sandstone behaviors
    lower: 1.0
    upper: 4.5
    initial: 2.203
    fixed: 2.203
    active: true
  et_scale:
    description: Thornthwaite ET scaling — FREE, constant across decades
    lower: 0.3
    upper: 3.0
    initial: 0.755
    fixed: 0.755
    active: true
  recession_b_soil:
    description: b_soil — linear (loess+topsoil)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  log__fdd_threshold:
    description: FGI — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
