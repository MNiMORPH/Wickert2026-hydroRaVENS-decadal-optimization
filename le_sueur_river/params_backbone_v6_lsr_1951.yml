# Le Sueur River v6 backbone, 1951-2020 window (mirrors BLR v6.2).
#
# Step A of LSR experiment: same A3 multipath architecture as BLR v6.2,
# same time window (1951-2020), to test if another till-substrate basin
# matches BLR's KGE ≈ 0.775 with similar parameters.
#
# Active (4): PDD_melt_factor, log__recession_coeff_till,
#             log__multipath_threshold_till, log__multipath_timescale_till.
# Fixed:      recession_b_till = 1.0, et_scale = 0.755 (BLR D3 mean), FGI off.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       le_sueur_config_v6.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          1
  reservoir_order:       [till]
  enforce_water_balance: none
  min_obs:               3000
  decades:
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 6.0
    fixed: 6.0
    active: true
  log__recession_coeff_till:
    description: log10 matrix recession timescale τ [days]
    lower: 0.5
    upper: 4.0
    initial: 2.7
    fixed: 2.7
    active: true
  log__multipath_threshold_till:
    description: log10 multipath activation depth H_thr [mm]
    lower: 0.5
    upper: 3.0
    initial: 2.1
    fixed: 2.1
    active: true
  log__multipath_timescale_till:
    description: log10 multipath drain timescale τ_mp [days]
    lower: 0.0
    upper: 2.0
    initial: 1.4
    fixed: 1.4
    active: true
  log__fdd_threshold:
    description: log10 FGI threshold — inactive (frozen_ground off)
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  recession_b_till:
    description: b — linear matrix (multipath carries shape)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  et_scale:
    description: Thornthwaite ET scaling — fixed at BLR D3 mean (0.755)
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
