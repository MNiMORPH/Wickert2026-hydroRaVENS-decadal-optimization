timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/centroid_forcing_backup/blue_earth_river_forcing_centroid.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 50.0      # soil-zone reservoir
    - 500.0     # shallow till
    - 2000.0    # deep/dense till
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 6270.9
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 200       # soil zone (placeholder; calibrated per-decade)
    - 3000      # shallow till (placeholder; calibrated in backbone)
    - 50000     # deep/dense till (placeholder; calibrated in backbone)
  exfiltration_fractions:
    - 0.7       # soil: fraction to stream (remainder recharges shallow till)
    - 0.5       # shallow till: fraction to stream (remainder recharges deep till)
    - 1.0       # deep till: all to stream (bottom reservoir)
  maximum_effective_depths__mm:
    - 100.0     # soil Hmax (placeholder; calibrated per-decade)
    - .inf      # shallow till: uncapped
    - .inf      # deep till: uncapped

snowmelt:
  PDD_melt_factor: 5.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
