timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/centroid_forcing_backup/blue_earth_river_forcing_centroid.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 500.0     # till+tile reservoir (placeholder; chained ICs in transient)
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 6270.9
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_timescales__days:
    - 3000      # till+tile (placeholder; calibrated per-decade in transient)
  exfiltration_fractions:
    - 1.0       # all to stream (single bottom reservoir)
  maximum_effective_depths__mm:
    - 1000000.0     # no Hmax in v5; set large so config never constrains

snowmelt:
  PDD_melt_factor: 5.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
