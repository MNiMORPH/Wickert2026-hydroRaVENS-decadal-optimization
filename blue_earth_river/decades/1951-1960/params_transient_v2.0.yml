# 1951-1960: transient calibration v2.0.
# Backbone fixed (backbone_v2.0); 4 active: log__recession_coeff_soil, f_exfiltration_soil, et_scale, log__Hmax_soil.
# b_soil=2 fixed; 3-reservoir soil/shallow_till/deep_till architecture.
# spin_up_cycles=1 (first decade, analytical SS start).

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 200
  ego_seed: 42
  ps_max_evaluations: 500
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: blue_earth_config_v2.yml
  metric: KGE_logKGE
  spin_up_cycles: 1
  routing_N: 2
  n_reservoirs: 3
  reservoir_order:
  - soil
  - shallow_till
  - deep_till
  decade_start: '1951-01-01'
  decade_end: '1960-12-31'
  enforce_water_balance: none
parameters:
  log__recession_coeff_soil:
    description: log10 soil recession coefficient κ [days] — per-decade tile-drain
      efficiency proxy
    lower: 1.0
    upper: 4.5
    initial: 1.782
    fixed: 1.782
    active: true
  f_exfiltration_soil:
    description: fraction of soil drainage to stream (remainder recharges shallow
      till) — per-decade
    lower: 0.01
    upper: 0.99
    initial: 0.7
    fixed: 0.7
    active: true
  et_scale:
    description: Thornthwaite ET multiplier (land cover / decade)
    lower: 0.3
    upper: 2.0
    initial: 1.0
    fixed: 1.0
    active: true
  log__Hmax_soil:
    description: log10 soil reservoir max storage [mm] — tile-drain ceiling; large=undrained,
      small=heavily drained
    lower: 1.0
    upper: 3.0
    initial: 2.0
    fixed: 2.0
    active: true
  log__recession_coeff_shallow_till:
    description: log10 shallow till recession τ [days] — backbone_v2.0 fixed
    lower: 1.0
    upper: 5.0
    initial: 1.000101611
    fixed: 1.000101611
    active: false
  log__recession_coeff_deep_till:
    description: log10 deep/dense till recession τ [days] — backbone_v2.0 fixed
    lower: 2.5
    upper: 5.5
    initial: 2.500076208
    fixed: 2.500076208
    active: false
  PDD_melt_factor:
    description: degree-day snowmelt rate — backbone_v2.0 fixed
    lower: 0.1
    upper: 10.0
    initial: 6.170118884
    fixed: 6.170118884
    active: false
  log__fdd_threshold:
    description: log10 FGI threshold [degC·day] — backbone_v2.0 fixed
    lower: 0.0
    upper: 3.0
    initial: 1.037372352
    fixed: 1.037372352
    active: false
  f_exfiltration_shallow_till:
    description: fraction of shallow till drainage to stream — backbone_v2.0 fixed
    lower: 0.01
    upper: 0.99
    initial: 0.5
    fixed: 0.5
    active: false
  recession_b_soil:
    description: soil recession exponent — fixed at 2 (Dupuit-Forchheimer)
    lower: 1.5
    upper: 6.0
    initial: 2.0
    fixed: 2.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional GW import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  log__H0_soil:
    description: log10 initial soil H [mm] — set by IC chain
    lower: 0.0
    upper: 4.0
    initial: 1.7
    fixed: 1.7
    active: false
  log__H0_shallow_till:
    description: log10 initial shallow till H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: 2.7
    fixed: 2.7
    active: false
  log__H0_deep_till:
    description: log10 initial deep till H [mm] — set by IC chain
    lower: 0.0
    upper: 6.0
    initial: 3.3
    fixed: 3.3
    active: false
  H0_snowpack:
    description: initial snowpack SWE [mm] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 0.0
    fixed: 0.0
    active: false
  H0_fgi:
    description: initial frozen ground index [degC·day] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 0.0
    fixed: 0.0
    active: false
  H0_deficit_carry:
    description: initial ET deficit carry [mm] — 0 for first decade
    lower: -1000000.0
    upper: 1000000.0
    initial: 0.0
    fixed: 0.0
    active: false
