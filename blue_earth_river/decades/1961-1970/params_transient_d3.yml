modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 80
  ego_seed: 42
  ps_max_evaluations: 200
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: blue_earth_config_v3.yml
  metric: KGE_logKGE
  spin_up_cycles: 0
  routing_N: 2
  n_reservoirs: 1
  reservoir_order:
  - till
  decade_start: '1961-01-01'
  decade_end: '1970-12-31'
  enforce_water_balance: none
parameters:
  et_scale:
    description: Thornthwaite ET multiplier — only active per-decade param (D3)
    lower: 0.3
    upper: 2.0
    initial: 1.0
    fixed: 1.0
    active: true
  PDD_melt_factor:
    description: degree-day snowmelt rate — D2a fixed
    lower: 0.1
    upper: 10.0
    initial: 4.2145
    fixed: 4.2145
    active: false
  log__fdd_threshold:
    description: log10 FGI threshold — D2a fixed
    lower: 0.0
    upper: 3.0
    initial: 0.9999
    fixed: 0.9999
    active: false
  log__recession_coeff_till:
    description: log10 till+tile κ [days] — D2a fixed (global)
    lower: 0.0
    upper: 3.5
    initial: 2.4778
    fixed: 2.4778
    active: false
  log__Hmax_till:
    description: log10 Hmax_till [mm] — D2a fixed (global)
    lower: 1.0
    upper: 3.5
    initial: 3.3315
    fixed: 3.3315
    active: false
  recession_b_till:
    description: till+tile b — Dupuit (D2a)
    lower: 1.0
    upper: 4.5
    initial: 2.0
    fixed: 2.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional GW import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  log__H0_till:
    description: log10 initial till+tile H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: 1.336184
    fixed: 1.336184
    active: false
  H0_snowpack:
    description: initial snowpack SWE [mm] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 9.871
    fixed: 9.871
    active: false
  H0_fgi:
    description: initial frozen ground index [degC·day] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 222.8799
    fixed: 222.8799
    active: false
  H0_deficit_carry:
    description: initial ET deficit carry [mm] — 0 for first decade
    lower: -1000000.0
    upper: 1000000.0
    initial: 0.0
    fixed: 0.0
    active: false
