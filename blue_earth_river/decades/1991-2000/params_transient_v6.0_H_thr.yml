modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: false
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 80
  ego_seed: 42
  ps_max_evaluations: 250
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: blue_earth_config_v6.yml
  metric: KGE_logKGE
  spin_up_cycles: 0
  routing_N: 2
  n_reservoirs: 1
  reservoir_order:
  - till
  decade_start: '1991-01-01'
  decade_end: '2000-12-31'
  enforce_water_balance: none
parameters:
  log__multipath_threshold_till:
    description: log10 multipath H_thr — only per-decade active (tile-depth test)
    lower: 0.5
    upper: 3.0
    initial: 2.1068
    fixed: 2.1068
    active: true
  PDD_melt_factor:
    description: degree-day snowmelt rate — v6.1 fixed
    lower: 0.1
    upper: 10.0
    initial: 6.0457
    fixed: 6.0457
    active: false
  log__recession_coeff_till:
    description: log10 matrix τ — v6.1 fixed (global)
    lower: 0.5
    upper: 4.0
    initial: 2.7184
    fixed: 2.7184
    active: false
  log__multipath_timescale_till:
    description: log10 multipath τ_mp — v6.1 fixed (global)
    lower: 0.0
    upper: 2.0
    initial: 1.3678
    fixed: 1.3678
    active: false
  log__fdd_threshold:
    description: FGI threshold — inactive (frozen_ground off per v6.2)
    lower: 0.0
    upper: 4.0
    initial: 1.1861
    fixed: 1.1861
    active: false
  recession_b_till:
    description: b — linear matrix (v6 default)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  et_scale:
    description: Thornthwaite ET scaling — D3 mean fixed (0.755)
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional GW import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  log__H0_till:
    description: log10 initial till+tile H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: 0.640943
    fixed: 0.640943
    active: false
  H0_snowpack:
    description: initial snowpack SWE [mm] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 19.9566
    fixed: 19.9566
    active: false
  H0_fgi:
    description: initial frozen ground index — irrelevant (FGI off)
    lower: 0.0
    upper: 500.0
    initial: 0.0
    fixed: 0.0
    active: false
  H0_deficit_carry:
    description: initial ET deficit carry [mm]
    lower: -1000000.0
    upper: 1000000.0
    initial: 0.0
    fixed: 0.0
    active: false
