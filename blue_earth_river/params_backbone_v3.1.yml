# Backbone calibration v3.1 — 1-reservoir till+tile (Blue Earth River).
#
# Iteration from backbone_v3.0 (mean KGE=0.5119).
# log__recession_coeff_till: per-decade from transient_v3.0 (mean=2.3646, κ=231.5 d).
# Active param initials (PDD, FGI) seeded from backbone_v3.0 best-fit.
#
# Active (2 params): PDD_melt_factor, log__fdd_threshold (snow-only).
# Fixed: recession_b_till=2; κ_till per decade (driver.per_decade_k_till).
#
modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 200
  ego_seed: 42
  ps_max_evaluations: 500
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: blue_earth_config_v3.yml
  metric: KGE_logKGE
  spin_up_cycles: 1
  routing_N: 2
  n_reservoirs: 1
  reservoir_order:
  - till
  enforce_water_balance: global
  min_obs: 3000
  decades:
  - start: '1951-01-01'
    end: '1960-12-31'
  - start: '1961-01-01'
    end: '1970-12-31'
  - start: '1971-01-01'
    end: '1980-12-31'
  - start: '1981-01-01'
    end: '1990-12-31'
  - start: '1991-01-01'
    end: '2000-12-31'
  - start: '2001-01-01'
    end: '2010-12-31'
  - start: '2011-01-01'
    end: '2020-12-31'
  per_decade_k_till:
    1951-1960: 2.354601
    1961-1970: 2.298346
    1971-1980: 2.928144
    1981-1990: 2.480032
    1991-2000: 2.239719
    2001-2010: 2.177625
    2011-2020: 2.073767
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 5.174923
    fixed: 5.174923
    active: true
  log__fdd_threshold:
    description: log10 frozen-ground-index threshold [degC·day]
    lower: 0.0
    upper: 3.0
    initial: 0.365061
    fixed: 0.365061
    active: true
  log__recession_coeff_till:
    description: log10 till+tile recession coefficient κ [days] — fixed at v2.0 mean;
      per-decade in transient
    lower: 1.0
    upper: 4.5
    initial: 2.364605
    fixed: 2.364605
    active: false
  log__Hmax_till:
    description: log10 till+tile max storage [mm] — fixed at v2.0 mean; per-decade
      in transient
    lower: 1.0
    upper: 4.0
    initial: 3.412789
    fixed: 3.412789
    active: false
  recession_b_till:
    description: till+tile recession exponent — fixed at 2 (Dupuit-Forchheimer)
    lower: 1.0
    upper: 3.0
    initial: 2.0
    fixed: 2.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  et_scale:
    description: ET multiplier — inactive (global WB enforcement in backbone)
    lower: 0.5
    upper: 2.0
    initial: 1.0
    fixed: 1.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
