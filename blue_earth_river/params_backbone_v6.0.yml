# v6.0 backbone: A3 architecture, all-global static calibration.
#
# Active (5): PDD_melt_factor, log__fdd_threshold,
#             log__recession_coeff_till (matrix τ),
#             log__multipath_threshold_till (H_thr),
#             log__multipath_timescale_till (τ_mp)
# Fixed:
#   recession_b_till = 1.0   (linear matrix)
#   et_scale = 0.755         (D3 mean Thornthwaite bias correction)
#   Hmax = 1e9               (no cap; driver passes [1e9])
#   enforce_water_balance = none  (et_scale closes the budget)
#
# Comparison baselines: D2a (b=2 static) = 0.611, D3 (ET-only per-decade) = 0.660,
#                       v3.1 (3 per-decade) = 0.681.
modules:
  snowpack:          true
  frozen_ground:     true
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     true
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      200
  ego_seed:                 42
  ps_max_evaluations:       500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       blue_earth_config_v6.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          1
  reservoir_order:       [till]
  enforce_water_balance: none
  min_obs:               3000
  decades:
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1981-01-01', end: '1990-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 4.2
    fixed: 4.2
    active: true
  log__fdd_threshold:
    description: log10 frozen-ground-index threshold [degC·day]
    lower: 0.0
    upper: 3.0
    initial: 1.5
    fixed: 1.5
    active: true
  log__recession_coeff_till:
    description: log10 matrix recession timescale τ [days]
    lower: 0.5
    upper: 3.0
    initial: 2.0
    fixed: 2.0
    active: true
  log__multipath_threshold_till:
    description: log10 multipath activation depth H_thr [mm SWE storage]
    lower: 0.5
    upper: 3.0
    initial: 1.7
    fixed: 1.7
    active: true
  log__multipath_timescale_till:
    description: log10 multipath drain timescale τ_mp [days]
    lower: 0.0
    upper: 2.0
    initial: 0.7
    fixed: 0.7
    active: true
  recession_b_till:
    description: recession exponent — fixed at 1.0 (linear matrix)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  et_scale:
    description: Thornthwaite ET scaling — fixed at D3 mean (0.755)
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
