# Cannon v7.1 backbone: v7.0 with FGI module disabled (sanity check).
#
# Tests whether the high log_FGI = 2.65 found in v7.0 represents real frozen-ground
# signal or the same equifinality observed in BLR v6 (multipath threshold absorbs
# the spring-melt response, leaving FGI degenerate).
#
# Active (6): PDD, log__recession_coeff_soil, log__multipath_threshold_soil,
#             log__multipath_timescale_soil, f_exfiltration_soil, et_scale
# Disabled: log__fdd_threshold (frozen_ground module off)
modules:
  snowpack:          true
  frozen_ground:     false      # ← disabled
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      300
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       cannon_config_v7.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          3
  reservoir_order:       [soil, intermediate, deep]
  enforce_water_balance: none
  min_obs:               3000
  decades:
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 7.26
    fixed: 7.26
    active: true
  log__recession_coeff_soil:
    description: log10 soil matrix recession timescale τ [days]
    lower: 0.5
    upper: 4.0
    initial: 2.44
    fixed: 2.44
    active: true
  log__multipath_threshold_soil:
    description: log10 multipath activation depth H_thr [mm SWE storage]
    lower: 0.5
    upper: 3.0
    initial: 2.10
    fixed: 2.10
    active: true
  log__multipath_timescale_soil:
    description: log10 multipath drain timescale τ_mp [days]
    lower: 0.0
    upper: 2.0
    initial: 1.36
    fixed: 1.36
    active: true
  f_exfiltration_soil:
    description: soil-reservoir matrix-outflow fraction to stream
    lower: 0.0
    upper: 1.0
    initial: 0.71
    fixed: 0.71
    active: true
  et_scale:
    description: Thornthwaite ET scaling — calibrated
    lower: 0.3
    upper: 2.0
    initial: 0.69
    fixed: 0.69
    active: true
  log__fdd_threshold:
    description: log10 FGI threshold — inactive (frozen_ground module off)
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  log__recession_coeff_intermediate:
    description: log10 intermediate τ — v6.3 fixed
    lower: 0.5
    upper: 5.0
    initial: 4.2016
    fixed: 4.2016
    active: false
  log__recession_coeff_deep:
    description: log10 deep τ — v6.3 fixed
    lower: 0.5
    upper: 5.0
    initial: 3.0962
    fixed: 3.0962
    active: false
  f_exfiltration_deep:
    description: deep-reservoir threshold-junction outflow fraction — v6.3 fixed
    lower: 0.0
    upper: 1.0
    initial: 0.5857
    fixed: 0.5857
    active: false
  recession_b_soil:
    description: b_soil — fixed at 1.0 (linear; multipath carries shape)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
