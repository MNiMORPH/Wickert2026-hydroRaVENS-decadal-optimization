timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/cannon_river/cannon_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 100.0     # soil (top) reservoir with multipath
    - 100.0     # intermediate / PdC
    - 1000.0    # deep / Wonewoc
  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 3474.9
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_timescales__days:
    - 60        # soil matrix τ (placeholder; calibrated)
    - 16000     # intermediate (fixed at v6.3)
    - 1250      # deep (fixed at v6.3)
  exfiltration_fractions:
    - 0.5       # soil (calibrated; partition to stream vs. percolation)
    - 1.0       # intermediate (leakance junction overrides — value unused)
    - 0.586     # deep (fixed at v6.3)
  maximum_effective_depths__mm:
    - 1000000.0 # no cap on soil (multipath shapes Q(H), not Hmax)
    - .inf
    - .inf
  multipath_thresholds__mm:
    - 50.0      # soil — placeholder; calibrated
    - null      # intermediate — off
    - null      # deep — off
  multipath_timescales__days:
    - 5.0       # soil — placeholder; calibrated
    - null
    - null
  recession_exponents:
    - 1.0       # soil: linear matrix (b=1); shape carried by multipath
    - 1.0       # intermediate
    - 1.0       # deep
  junction_types:
    - fraction
    - leakance
    - threshold
  leakance_R__days:
    - null      # soil: fraction junction (no leakance)
    - 9.79      # intermediate: leakance R = 10**0.99 (v6.3 fixed)
    - null
  H_threshold__mm:
    - null
    - null
    - 14.5      # deep: H_thr = 10**1.16 (v6.3 fixed)

snowmelt:
  PDD_melt_factor: 5.64
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
