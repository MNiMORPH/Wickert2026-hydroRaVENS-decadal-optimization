# Backbone calibration: joint optimization across all full-coverage decades.
#
# Active (7 params): geologic + snow-physics backbone, shared across all decades.
# Fixed: per-decade soil/ET params held at mid-range for backbone search.
# ICs: analytical steady-state per decade (no chaining; spin_up_cycles=1).
#
# Full-coverage decades scored (>=3000 obs):
#   1931-1940, 1941-1950, 1951-1960, 1961-1970,
#   1991-2000, 2001-2010, 2011-2020
# Score = mean KGE_logKGE across all valid decades.
#
# After backbone calibration: copy best-fit values into params_transient.yml
# for each decade, then run run_transient.sh for per-decade soil/ET calibration.

modules:
  snowpack:          true
  frozen_ground:     true
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     true
  et_water_stress:   false
  et_reservoir_draw: true

dakota:
  ego_initial_samples:       500
  ego_seed:                  42
  ps_max_evaluations:        1000
  ps_convergence_tolerance:  1.0e-5
  evaluation_concurrency:    8

driver:
  config_template:       'cannon_config_1893_2024.yml'
  metric:                'KGE_logKGE'
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          3
  reservoir_order:       ['soil', 'intermediate', 'deep']
  enforce_water_balance: 'global'
  min_obs:               3000
  decades:
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}

parameters:

  # ---- BACKBONE (active) ----

  log__recession_coeff_intermediate:
    description: "log10 PdC recession coefficient [days]"
    lower:   1.0
    upper:   5.0
    initial: 3.0
    fixed:   3.0
    active:  true

  log__recession_coeff_deep:
    description: "log10 Wonewoc recession coefficient [days]"
    lower:   3.0
    upper:   5.5
    initial: 4.3
    fixed:   4.3
    active:  true

  log__leakance_R_intermediate:
    description: "log10 St. Lawrence shale leakance resistance [days]"
    lower:   0.5
    upper:   5.0
    initial: 3.75
    fixed:   3.75
    active:  true

  f_exfiltration_deep:
    description: "fraction of above-threshold Wonewoc drainage to stream"
    lower:   0.01
    upper:   0.99
    initial: 0.40
    fixed:   0.40
    active:  true

  log__H_threshold_deep:
    description: "log10 Wonewoc dead-storage threshold [mm]"
    lower:   0.0
    upper:   3.5
    initial: 2.1
    fixed:   2.1
    active:  true

  PDD_melt_factor:
    description: "degree-day snowmelt rate [mm SWE / degC / day]"
    lower:   0.1
    upper:   10.0
    initial: 8.0
    fixed:   8.0
    active:  true

  log__fdd_threshold:
    description: "log10 frozen-ground-index threshold [degC·day]"
    lower:   0.0
    upper:   3.0
    initial: 2.37
    fixed:   2.37
    active:  true

  # ---- SOIL (fixed at mid-range; calibrated per-decade in transient run) ----

  log__recession_coeff_soil:
    description: "log10 soil recession coefficient [days] — fixed at mid-range for backbone search"
    lower:   1.0
    upper:   4.5
    initial: 3.9
    fixed:   3.9
    active:  false

  recession_b_soil:
    description: "soil recession exponent — fixed at mid-range"
    lower:   1.5
    upper:   6.0
    initial: 5.0
    fixed:   5.0
    active:  false

  f_exfiltration_soil:
    description: "fraction of soil drainage to stream — fixed at mid-range"
    lower:   0.01
    upper:   0.99
    initial: 0.53
    fixed:   0.53
    active:  false

  # ---- INACTIVE ----

  f_exfiltration_intermediate:
    description: "dead param under leakance junction"
    lower:   0.01
    upper:   0.99
    initial: 0.012
    fixed:   0.012
    active:  false

  recession_b_intermediate:
    description: "PdC recession exponent fixed (Brutsaert-Nieber)"
    lower:   1.0
    upper:   6.0
    initial: 2.203
    fixed:   2.203
    active:  false

  snow_insulation_k:
    description: "snow insulation — inactive"
    lower:   0.0
    upper:   0.5
    initial: 0.0
    fixed:   0.0
    active:  false

  et_scale:
    description: "ET multiplier — inactive (global WB enforcement)"
    lower:   0.5
    upper:   2.0
    initial: 1.0
    fixed:   1.0
    active:  false

  et_alpha:
    description: "ET partition fraction — fixed"
    lower:   0.01
    upper:   0.99
    initial: 1.0
    fixed:   1.0
    active:  false

  f_direct_runoff:
    description: "fast-bypass fraction — inactive"
    lower:   0.0
    upper:   0.5
    initial: 0.0
    fixed:   0.0
    active:  false

  baseflow_Q:
    description: "regional groundwater import — inactive"
    lower:   0.0
    upper:   0.5
    initial: 0.0
    fixed:   0.0
    active:  false

  log__routing_K:
    description: "Nash-cascade K — inactive"
    lower:   -1.0
    upper:    1.0
    initial:  0.0
    fixed:    0.0
    active:  false
