# cannon_cfg_template.yml
# Template configuration for hydroRaVENS Cannon River calibration.
# Physical parameters (e_folding_residence_times__days, exfiltration_fractions,
# PDD_melt_factor) are overridden by the Dakota driver after initialize().
# spin_up_cycles is 0 here; the driver runs spin-up manually so that the
# calibrated parameters are in effect before any simulation.

timeseries:
  datafile: CannonTestInput.csv

initial_conditions:
  water_reservoir_effective_depths__m:
    - 0.1     # shallow reservoir [m]
    - 100     # deep reservoir [m]
  snowpack__m_SWE: 0

catchment:
  drainage_basin_area__km2: 3800
  evapotranspiration_method: datafile
  water_year_start_month: 10  # USGS convention: water year starts in October

general:
  scalar_dt: true
  spin_up_cycles: 0  # driver.py performs spin-up after setting calibrated parameters

reservoirs:
  e_folding_residence_times__days:
    - 16      # shallow reservoir (placeholder; overridden by driver)
    - 2000    # deep reservoir   (placeholder; overridden by driver)
  exfiltration_fractions:
    - 0.8     # shallow: fraction discharged to stream vs. percolated deeper (overridden)
    - 1.0     # deep: must be 1.0 for mass conservation
  maximum_effective_depths__m:
    - .inf
    - .inf

snowmelt:
  PDD_melt_factor: 1.0   # mm SWE per positive degC per day (placeholder; overridden)
