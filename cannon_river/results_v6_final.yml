notes:
- No temporal trend detected in per-decade soil-zone parameters (log__recession_coeff_soil,
  f_exfiltration_soil, log__Hmax_soil, et_scale) across 1931-2020.
- 'This is interpreted as: (a) Cannon River basin may have been heavily tiled before
  the calibration window; (b) decadal climate variability may dominate over land-use
  change signal; (c) 1971-1990 data gap breaks continuity.'
- '1961-1970 is a persistent outlier: KGE=0.785 in v6.0 (fixed geology) but 0.720-0.731
  in v6.x. Warrants investigation.'
- 'Best calibration: v6.3 transient (backbone KGE=0.619, transient mean KGE=0.737).
  v6.2 and v6.3 transients are statistically indistinguishable at the mean.'
