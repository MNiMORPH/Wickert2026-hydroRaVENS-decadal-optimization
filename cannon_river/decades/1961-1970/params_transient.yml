modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 200
  ego_seed: 42
  ps_max_evaluations: 500
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: cannon_config_1893_2024.yml
  metric: KGE_logKGE
  spin_up_cycles: 0
  routing_N: 2
  n_reservoirs: 3
  reservoir_order:
  - soil
  - intermediate
  - deep
  decade_start: '1961-01-01'
  decade_end: '1970-12-31'
  enforce_water_balance: none
parameters:
  log__recession_coeff_soil:
    description: log10 soil recession coefficient κ [days; e-folding time iff b=1]
    lower: 1.0
    upper: 4.5
    initial: 3.5
    fixed: 3.5
    active: true
  recession_b_soil:
    description: soil recession exponent
    lower: 1.5
    upper: 6.0
    initial: 5.0
    fixed: 5.0
    active: true
  f_exfiltration_soil:
    description: fraction of soil drainage to stream
    lower: 0.01
    upper: 0.99
    initial: 0.53
    fixed: 0.53
    active: true
  et_scale:
    description: Thornthwaite ET multiplier (land cover / decade)
    lower: 0.3
    upper: 2.0
    initial: 1.0
    fixed: 1.0
    active: true
  log__recession_coeff_intermediate:
    description: log10 PdC recession coefficient κ [days; e-folding time iff b=1] — backbone fixed
    lower: 1.0
    upper: 5.0
    initial: 4.856558642
    fixed: 4.856558642
    active: false
  log__recession_coeff_deep:
    description: log10 Wonewoc recession coefficient κ [days; e-folding time iff b=1] — backbone fixed
    lower: 3.0
    upper: 5.5
    initial: 4.131880144
    fixed: 4.131880144
    active: false
  log__leakance_R_intermediate:
    description: log10 St. Lawrence shale leakance resistance [days] — backbone fixed
    lower: 0.5
    upper: 5.0
    initial: 3.108478009
    fixed: 3.108478009
    active: false
  f_exfiltration_deep:
    description: Wonewoc fraction to stream — backbone fixed
    lower: 0.01
    upper: 0.99
    initial: 0.4328203447
    fixed: 0.4328203447
    active: false
  f_exfiltration_intermediate:
    description: dead param under leakance junction
    lower: 0.01
    upper: 0.99
    initial: 0.012
    fixed: 0.012
    active: false
  log__H_threshold_deep:
    description: log10 Wonewoc spring sill [mm] — backbone fixed
    lower: 0.0
    upper: 3.5
    initial: 2.798357124
    fixed: 2.798357124
    active: false
  PDD_melt_factor:
    description: degree-day snowmelt rate — backbone fixed
    lower: 0.1
    upper: 10.0
    initial: 5.61056713
    fixed: 5.61056713
    active: false
  log__fdd_threshold:
    description: log10 FGI threshold [degC·day] — backbone fixed
    lower: 0.0
    upper: 3.0
    initial: 2.904192387
    fixed: 2.904192387
    active: false
  recession_b_intermediate:
    description: PdC recession exponent — Brutsaert-Nieber fixed
    lower: 1.0
    upper: 6.0
    initial: 2.203
    fixed: 2.203
    active: false
  snow_insulation_k:
