modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 80
  ego_seed: 42
  ps_max_evaluations: 250
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: cannon_config_v7.yml
  metric: KGE_logKGE
  spin_up_cycles: 0
  routing_N: 2
  n_reservoirs: 3
  reservoir_order:
  - soil
  - intermediate
  - deep
  decade_start: '1951-01-01'
  decade_end: '1960-12-31'
  enforce_water_balance: none
parameters:
  et_scale:
    description: Thornthwaite ET multiplier — only per-decade active (ET bias test)
    lower: 0.3
    upper: 2.0
    initial: 0.6913
    fixed: 0.6913
    active: true
  PDD_melt_factor:
    description: degree-day snowmelt rate — v7.0 fixed
    lower: 0.1
    upper: 10.0
    initial: 7.2571
    fixed: 7.2571
    active: false
  log__fdd_threshold:
    description: log10 FGI threshold — v7.0 fixed
    lower: 0.0
    upper: 4.0
    initial: 2.6506
    fixed: 2.6506
    active: false
  log__recession_coeff_soil:
    description: log10 soil matrix τ — v7.0 fixed (global)
    lower: 0.5
    upper: 4.0
    initial: 2.4416
    fixed: 2.4416
    active: false
  log__multipath_threshold_soil:
    description: log10 multipath H_thr — v7.0 fixed (global)
    lower: 0.5
    upper: 3.0
    initial: 2.098
    fixed: 2.098
    active: false
  log__multipath_timescale_soil:
    description: log10 multipath τ — v7.0 fixed (global)
    lower: 0.0
    upper: 2.0
    initial: 1.3555
    fixed: 1.3555
    active: false
  f_exfiltration_soil:
    description: soil-reservoir matrix outflow fraction — v7.0 fixed
    lower: 0.0
    upper: 1.0
    initial: 0.7094
    fixed: 0.7094
    active: false
  log__recession_coeff_intermediate:
    description: log10 intermediate τ — v6.3 fixed
    lower: 0.5
    upper: 5.0
    initial: 4.2016
    fixed: 4.2016
    active: false
  log__recession_coeff_deep:
    description: log10 deep τ — v6.3 fixed
    lower: 0.5
    upper: 5.0
    initial: 3.0962
    fixed: 3.0962
    active: false
  f_exfiltration_deep:
    description: deep-reservoir f_exfil — v6.3 fixed
    lower: 0.0
    upper: 1.0
    initial: 0.5857
    fixed: 0.5857
    active: false
  recession_b_soil:
    description: b_soil — fixed at 1.0 (linear; multipath carries shape)
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional GW import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  log__H0_soil:
    description: log10 initial soil H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: -2.0
    fixed: -2.0
    active: false
  log__H0_intermediate:
    description: log10 initial intermediate H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: 3.192883
    fixed: 3.192883
    active: false
  log__H0_deep:
    description: log10 initial deep H [mm] — set by IC chain
    lower: 0.0
    upper: 5.0
    initial: 2.154785
    fixed: 2.154785
    active: false
  H0_snowpack:
    description: initial snowpack SWE [mm] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 49.6284
    fixed: 49.6284
    active: false
  H0_fgi:
    description: initial frozen ground index [degC·day] — set by IC chain
    lower: 0.0
    upper: 500.0
    initial: 424.4361
    fixed: 424.4361
    active: false
  H0_deficit_carry:
    description: initial ET deficit carry [mm]
    lower: -1000000.0
    upper: 1000000.0
    initial: 0.0
    fixed: 0.0
    active: false
