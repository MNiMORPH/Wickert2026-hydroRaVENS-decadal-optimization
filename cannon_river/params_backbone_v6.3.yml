# Backbone calibration v6.3 — soil-reservoir tile-drain architecture.
#
# Iteration from backbone_v6.2 (mean KGE=0.6077).
# log__recession_coeff_soil: per-decade from transient_v6.2 (mean=1.7815, τ=60.5 d).
# Active param initials seeded from backbone_v6.2 best-fit.
#
# Active (7 params): geologic (5) + snow (2).
# Fixed: b_soil=2 (Dupuit-Forchheimer); log__recession_coeff_soil per decade (driver.per_decade_k_soil).
#
modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: true
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 500
  ego_seed: 42
  ps_max_evaluations: 1000
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: cannon_config_1893_2024.yml
  metric: KGE_logKGE
  spin_up_cycles: 1
  routing_N: 2
  n_reservoirs: 3
  reservoir_order:
  - soil
  - intermediate
  - deep
  enforce_water_balance: global
  min_obs: 3000
  decades:
  - start: '1931-01-01'
    end: '1940-12-31'
  - start: '1941-01-01'
    end: '1950-12-31'
  - start: '1951-01-01'
    end: '1960-12-31'
  - start: '1961-01-01'
    end: '1970-12-31'
  - start: '1991-01-01'
    end: '2000-12-31'
  - start: '2001-01-01'
    end: '2010-12-31'
  - start: '2011-01-01'
    end: '2020-12-31'
  per_decade_k_soil:
    1931-1940: 2.002459
    1941-1950: 1.877625
    1951-1960: 1.750141
    1961-1970: 1.624762
    1991-2000: 1.781788
    2001-2010: 1.776294
    2011-2020: 1.657499
parameters:
  log__recession_coeff_intermediate:
    description: log10 PdC recession coefficient κ [days; e-folding time iff b=1]
    lower: 1.0
    upper: 5.0
    initial: 4.382716
    fixed: 4.382716
    active: true
  log__recession_coeff_deep:
    description: log10 Wonewoc recession coefficient κ [days; e-folding time iff b=1]
    lower: 3.0
    upper: 5.5
    initial: 3.019772
    fixed: 3.019772
    active: true
  log__leakance_R_intermediate:
    description: log10 St. Lawrence shale leakance resistance [days]
    lower: 0.5
    upper: 5.0
    initial: 1.990741
    fixed: 1.990741
    active: true
  f_exfiltration_deep:
    description: fraction of above-threshold Wonewoc drainage to stream
    lower: 0.01
    upper: 0.99
    initial: 0.587042
    fixed: 0.587042
    active: true
  log__H_threshold_deep:
    description: log10 Wonewoc dead-storage threshold [mm]
    lower: 0.0
    upper: 3.5
    initial: 1.173868
    fixed: 1.173868
    active: true
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 5.853484
    fixed: 5.853484
    active: true
  log__fdd_threshold:
    description: log10 frozen-ground-index threshold [degC·day]
    lower: 0.0
    upper: 3.0
    initial: 2.960442
    fixed: 2.960442
    active: true
  log__recession_coeff_soil:
    description: log10 soil recession coefficient κ [days] — fixed for backbone; per-decade
      in transient
    lower: 1.0
    upper: 4.5
    initial: 1.78151
    fixed: 1.78151
    active: false
  recession_b_soil:
    description: soil recession exponent — fixed at 2 (Dupuit-Forchheimer lateral
      flow)
    lower: 1.5
    upper: 6.0
    initial: 2.0
    fixed: 2.0
    active: false
  f_exfiltration_soil:
    description: fraction of soil drainage to stream — fixed at mid-range; per-decade
      in transient
    lower: 0.01
    upper: 0.99
    initial: 0.53
    fixed: 0.53
    active: false
  f_exfiltration_intermediate:
    description: dead param under leakance junction
    lower: 0.01
    upper: 0.99
    initial: 0.012
    fixed: 0.012
    active: false
  recession_b_intermediate:
    description: PdC recession exponent — Brutsaert-Nieber fixed
    lower: 1.0
    upper: 6.0
    initial: 2.203
    fixed: 2.203
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  et_scale:
    description: ET multiplier — inactive (global WB enforcement)
    lower: 0.5
    upper: 2.0
    initial: 1.0
    fixed: 1.0
    active: false
  et_alpha:
    description: ET partition fraction — fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: Nash-cascade K — inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
