# Wild Rice v8 backbone — joint static calibration with parallel sub-catchments.
#
# Two zones in parallel (areas fixed in config from surficial geology):
#   till_uplands (0.55): tile drainage (f_tile + tau_tile) on till soil
#   clay_lowlands (0.45): ditch drainage (multipath) on clay soil
#
# Same time windows + scoring as v7 joint (9 decades; pre-tile 1909-1917
# continuous span; skips 1981-1990 gauge gap).
#
# Active (11): PDD, 2x(k_soil, k_deep, f_exfil_soil), f_tile_till + tau_tile,
#              H_thr_clay + tau_mp_clay. et_scale and FGI fixed.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      500
  ego_seed:                 42
  ps_max_evaluations:       2000
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       wild_rice_config_v8_subcatchments.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1909-07-01', end: '1917-09-29'}   # pre-tile continuous
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  # ---- snow / global ----
  PDD_melt_factor:
    description: degree-day snowmelt rate [mm SWE / degC / day]
    lower: 0.1
    upper: 10.0
    initial: 5.5
    fixed: 5.5
    active: true
  # ---- till_uplands hydraulic (5 params) ----
  log__k_till_soil:
    description: log10 till soil matrix τ [days]
    lower: 0.5
    upper: 3.5
    initial: 1.7
    fixed: 1.7
    active: true
  log__k_till_deep:
    description: log10 till deep matrix τ [days]
    lower: 1.5
    upper: 4.5
    initial: 2.9
    fixed: 2.9
    active: true
  f_exfil_till_soil:
    description: till soil exfiltration fraction (rest → till deep)
    lower: 0.0
    upper: 1.0
    initial: 0.4
    fixed: 0.4
    active: true
  f_tile_till:
    description: fraction of till-soil percolation diverted to fast tile drain
    lower: 0.0
    upper: 1.0
    initial: 0.4
    fixed: 0.4
    active: true
  log__tau_tile_till:
    description: log10 tile-drain residence time [days]
    lower: 0.0
    upper: 1.7
    initial: 0.85
    fixed: 0.85
    active: true
  # ---- clay_lowlands hydraulic (5 params) ----
  log__k_clay_soil:
    description: log10 clay soil matrix τ [days]
    lower: 1.0
    upper: 4.0
    initial: 2.0
    fixed: 2.0
    active: true
  log__k_clay_deep:
    description: log10 clay deep matrix τ [days]
    lower: 2.0
    upper: 5.0
    initial: 3.3
    fixed: 3.3
    active: true
  f_exfil_clay_soil:
    description: clay soil exfiltration fraction (rest → clay deep)
    lower: 0.0
    upper: 1.0
    initial: 0.5
    fixed: 0.5
    active: true
  log__H_thr_clay:
    description: log10 multipath ditch activation depth H_thr [mm]
    lower: 0.5
    upper: 3.0
    initial: 1.7
    fixed: 1.7
    active: true
  log__tau_mp_clay:
    description: log10 ditch multipath drain timescale [days]
    lower: 0.0
    upper: 2.0
    initial: 0.7
    fixed: 0.7
    active: true
  # ---- fixed / inactive ----
  et_scale:
    description: Thornthwaite ET scaling — fixed at BLR D3 mean
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  log__fdd_threshold:
    description: log10 FGI threshold — inactive (frozen_ground off)
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  snow_insulation_k:
    description: snow insulation — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: fast-bypass fraction — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: regional groundwater import — inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
