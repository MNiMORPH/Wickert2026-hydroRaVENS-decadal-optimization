modules:
  snowpack: true
  frozen_ground: false
  rain_on_snow: true
  direct_runoff: false
  dtr_fgi_decay: false
  et_water_stress: false
  et_reservoir_draw: true
dakota:
  ego_initial_samples: 80
  ego_seed: 42
  ps_max_evaluations: 250
  ps_convergence_tolerance: 1.0e-05
  evaluation_concurrency: 8
driver:
  config_template: wild_rice_config_v7_2res.yml
  metric: KGE_logKGE
  spin_up_cycles: 0
  routing_N: 2
  n_reservoirs: 2
  reservoir_order:
  - soil
  - deep
  decade_start: '1971-01-01'
  decade_end: '1980-12-31'
  enforce_water_balance: none
parameters:
  log__recession_coeff_soil:
    description: log10 soil matrix τ — per-decade active (pre-tile vs post-tile test)
    lower: 0.5
    upper: 4.5
    initial: 2.5519
    fixed: 2.5519
    active: true
  PDD_melt_factor:
    description: PDD — Wild Rice v7-2res fixed
    lower: 0.1
    upper: 10.0
    initial: 4.4638
    fixed: 4.4638
    active: false
  log__multipath_threshold_soil:
