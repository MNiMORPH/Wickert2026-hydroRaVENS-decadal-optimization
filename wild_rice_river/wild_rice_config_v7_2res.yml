timeseries:
  datafile: /home/awickert/dataanalysis/Wickert2026-hydroRaVENS-decadal-optimization/forcing/wild_rice_river/wild_rice_forcing.csv

initial_conditions:
  water_reservoir_effective_depths__mm:
    - 50.0      # soil/surface clay (top): tile + ditch drainage zone
    - 500.0     # deep clay matrix: slow seepage

  snowpack__mm_SWE: 0

catchment:
  drainage_basin_area__km2: 2419.0
  evapotranspiration_method: ThornthwaiteChang2019
  water_year_start_month: 10
  baseflow_Q: 0.0

general:
  spin_up_cycles: 1

reservoirs:
  recession_coefficients:
    - 100       # soil clay τ (placeholder; calibrated)
    - 1000      # deep clay τ (placeholder; calibrated; expect long for clay)
  exfiltration_fractions:
    - 0.5
    - 1.0
  maximum_effective_depths__mm:
    - 1000000.0
    - .inf
  multipath_thresholds__mm:
    - 50.0      # soil — placeholder; calibrated
    - null      # deep — off
  multipath_timescales__days:
    - 5.0       # soil — placeholder; calibrated
    - null
  recession_exponents:
    - 1.0
    - 1.0

snowmelt:
  PDD_melt_factor: 5.0
  fgi_decay_coeff: 0.97
  snow_insulation_k: 0.0

modules:
  snowpack: true
  frozen_ground: true
  rain_on_snow: true
  direct_runoff: false
