# Wild Rice v7 (2-reservoir) backbone — joint static.
#
# Clay substrate needs 2 reservoirs: surface clay + tile/ditch drainage
# (multipath active) + deep clay matrix (slow). 1-reservoir v6 gave
# joint KGE = 0.446 with pre-tile decade catastrophically poor (0.12).
#
# Architecture choice: 2 reservoirs (not 3); Precambrian shield bedrock
# provides no productive deep aquifer.
#
# Active (6): PDD, log_κ_soil, log_H_thr_soil, log_τ_mp_soil,
#             f_exfil_soil, log_κ_deep.
modules:
  snowpack:          true
  frozen_ground:     false
  rain_on_snow:      true
  direct_runoff:     false
  dtr_fgi_decay:     false
  et_water_stress:   false
  et_reservoir_draw: true
dakota:
  ego_initial_samples:      300
  ego_seed:                 42
  ps_max_evaluations:       1500
  ps_convergence_tolerance: 1.0e-5
  evaluation_concurrency:   8
driver:
  config_template:       wild_rice_config_v7_2res.yml
  metric:                KGE_logKGE
  spin_up_cycles:        1
  routing_N:             2
  n_reservoirs:          2
  reservoir_order:       [soil, deep]
  enforce_water_balance: none
  min_obs:               2000
  decades:
    - {start: '1909-07-01', end: '1917-09-29'}
    - {start: '1931-01-01', end: '1940-12-31'}
    - {start: '1941-01-01', end: '1950-12-31'}
    - {start: '1951-01-01', end: '1960-12-31'}
    - {start: '1961-01-01', end: '1970-12-31'}
    - {start: '1971-01-01', end: '1980-12-31'}
    - {start: '1991-01-01', end: '2000-12-31'}
    - {start: '2001-01-01', end: '2010-12-31'}
    - {start: '2011-01-01', end: '2020-12-31'}
parameters:
  PDD_melt_factor:
    description: degree-day snowmelt rate
    lower: 0.1
    upper: 10.0
    initial: 5.5
    fixed: 5.5
    active: true
  log__recession_coeff_soil:
    description: log10 soil matrix τ [days]
    lower: 0.5
    upper: 4.0
    initial: 2.0
    fixed: 2.0
    active: true
  log__multipath_threshold_soil:
    description: log10 multipath H_thr [mm]
    lower: 0.5
    upper: 3.0
    initial: 2.0
    fixed: 2.0
    active: true
  log__multipath_timescale_soil:
    description: log10 multipath τ [days]
    lower: 0.0
    upper: 2.0
    initial: 1.2
    fixed: 1.2
    active: true
  f_exfiltration_soil:
    description: soil matrix outflow fraction to stream
    lower: 0.0
    upper: 1.0
    initial: 0.5
    fixed: 0.5
    active: true
  log__recession_coeff_deep:
    description: log10 deep clay matrix τ [days]
    lower: 1.0
    upper: 5.0
    initial: 3.5
    fixed: 3.5
    active: true
  recession_b_soil:
    description: b — linear
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  recession_b_deep:
    description: b — linear
    lower: 1.0
    upper: 4.5
    initial: 1.0
    fixed: 1.0
    active: false
  et_scale:
    description: ET scale — BLR D3 mean fixed
    lower: 0.3
    upper: 2.0
    initial: 0.755
    fixed: 0.755
    active: false
  log__fdd_threshold:
    description: FGI — inactive
    lower: 0.0
    upper: 4.0
    initial: 4.0
    fixed: 4.0
    active: false
  f_exfiltration_deep:
    description: deep — all to stream
    lower: 0.0
    upper: 1.0
    initial: 1.0
    fixed: 1.0
    active: false
  snow_insulation_k:
    description: inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  f_direct_runoff:
    description: inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  baseflow_Q:
    description: inactive
    lower: 0.0
    upper: 0.5
    initial: 0.0
    fixed: 0.0
    active: false
  log__routing_K:
    description: inactive
    lower: -1.0
    upper: 1.0
    initial: 0.0
    fixed: 0.0
    active: false
  et_alpha:
    description: fixed
    lower: 0.01
    upper: 0.99
    initial: 1.0
    fixed: 1.0
    active: false
